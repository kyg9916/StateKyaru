{% extends "base.html" %}

{% block content %}
<style>
    /* 1. 이 페이지 전용 애니메이션 및 스타일 */
    .analysis-wrapper {
        width: 100%;
        max-width: 600px; /* 공지사항이라 폭을 좀 좁게 잡는 게 예뻐요 */
        margin: 0 auto;
        padding-top: 50px;
        padding-bottom: 50px;
        animation: fadeInUp 0.5s ease-out;
    }

    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* 2. 카드 디자인: base.html 테마와 맞춤 */
    .notice-glass {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.6);
        padding: 40px;
        border-radius: 2.5rem;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.1);
        position: relative;
        overflow: hidden;
    }

    /* 아이콘 회전 애니메이션 */
    .rotate-pause { animation: rotate 10s linear infinite; }
    @keyframes rotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }

    /* 강조 박스 효과 */
    .notice-card {
        background: linear-gradient(to bottom right, #fff5f5, #ffffff);
        border: 1px solid #fee2e2;
    }

    /* 펄스 애니메이션 (알림 강조) */
    .pulse-red { animation: pulse 2s infinite; }
    @keyframes pulse {
        0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
        70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
        100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
</style>

<div class="analysis-wrapper">
    <div class="notice-glass">
        <div class="absolute -top-10 -right-10 w-32 h-32 bg-red-50 rounded-full blur-3xl opacity-50"></div>
        <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-blue-50 rounded-full blur-3xl opacity-50"></div>

        <div class="text-center mb-10 relative">
            <div class="relative inline-block mb-6">
                <div class="bg-gradient-to-tr from-gray-700 to-gray-900 w-24 h-24 rounded-[2rem] flex items-center justify-center mx-auto shadow-2xl rotate-6 transition-transform hover:rotate-0 duration-500">
                    <i class="fa-solid fa-compact-disc text-white text-5xl rotate-pause"></i>
                </div>
                <div class="absolute -bottom-2 -right-2 bg-red-500 w-10 h-10 rounded-full flex items-center justify-center border-4 border-white text-white pulse-red">
                    <i class="fa-solid fa-lock text-sm"></i>
                </div>
            </div>
            <h1 class="text-3xl font-black text-gray-800 tracking-tighter">유튜브 재생목록 음원추출기</h1>
            <p class="text-red-500 font-bold text-sm mt-3 flex items-center justify-center">
                <span class="w-2 h-2 bg-red-500 rounded-full mr-2 animate-ping"></span>
                서비스 이용 일시 중단 안내
            </p>
        </div>

        <div id="notice-area" class="space-y-8 relative">
            <div class="notice-card p-7 rounded-[2rem] shadow-sm">
                <div class="flex items-center mb-4">
                    <div class="w-10 h-10 bg-red-100 rounded-xl flex items-center justify-center mr-3">
                        <i class="fa-solid fa-triangle-exclamation text-red-600"></i>
                    </div>
                    <h2 class="text-lg font-black text-gray-800 tracking-tight">서비스 제한 공지</h2>
                </div>

                <div class="space-y-4 text-gray-600 leading-relaxed text-[15px]">
                    <p>
                        본 기능은 <span class="text-red-600 font-bold">저작권 정책</span> 및 <span class="text-red-600 font-bold">서버 운영 정책(Render)</span> 준수를 위해 현재 외부 이용이 제한되어 있습니다.
                    </p>
                    <div class="bg-white/50 p-4 rounded-xl border border-dashed border-red-200">
                        <p class="text-sm font-medium text-center">
                            📩 <span class="text-gray-800 italic">개발자에게 직접 문의하여 소스코드를 제공받으시기 바랍니다.</span>
                        </p>
                    </div>
                </div>
            </div>

            <div class="space-y-4">
                <button onclick="showAlert()" class="w-full bg-gradient-to-r from-gray-800 via-gray-700 to-gray-800 text-white font-black py-5 rounded-[1.5rem] shadow-xl hover:shadow-gray-200 transition-all active:scale-95 flex items-center justify-center gap-3 group">
                    <i class="fa-solid fa-shield-halved group-hover:rotate-12 transition-transform"></i>
                    <span>문의 후 이용하기</span>
                </button>

                <div class="flex justify-center items-center gap-4 text-gray-400">
                    <div class="h-[1px] w-12 bg-gray-200"></div>
                    <p class="text-[11px] font-bold tracking-widest uppercase">Contact Developer</p>
                    <div class="h-[1px] w-12 bg-gray-200"></div>
                </div>
            </div>

            <p class="text-center text-xs text-gray-400 font-medium">
                Designed with ❤️ for <span class="text-red-400 font-bold">초록자두</span> 개발팀
            </p>
        </div>
    </div>
</div>

<script>
    function showAlert() {
        const msg = "⚠️ 서비스 이용 안내\n\n본 기능은 저작권 및 서버 정책 문제로 자동 시스템 이용이 제한됩니다.\n\n개발자(초록자두)에게 문의하시면 개별적으로 소스코드나 파일을 받으실 수 있습니다.";
        alert(msg);
    }
</script>
{% endblock %}
