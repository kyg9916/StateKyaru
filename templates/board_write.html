<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>글쓰기 - 멤버십 페이지</title>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/summernote@0.8.18/dist/summernote.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/summernote@0.8.18/dist/summernote.min.js"></script>

    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f9f9f9; padding: 50px 0; }
        .container-custom { max-width: 900px; margin: 0 auto; background: white; padding: 40px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { font-size: 24px; margin-bottom: 30px; color: #5c7cfa; font-weight: bold; border-left: 5px solid #5c7cfa; padding-left: 15px; }

        .form-group label { font-weight: 600; color: #555; margin-bottom: 8px; }
        .form-control { border-radius: 8px; border: 1px solid #ddd; padding: 10px; height: auto; }

        .btn-area { display: flex; justify-content: flex-end; gap: 12px; margin-top: 30px; }
        .submit-btn { background-color: #5c7cfa; color: white; border: none; padding: 12px 30px; border-radius: 30px; font-weight: bold; transition: 0.2s; }
        .submit-btn:hover { background-color: #4263eb; transform: translateY(-2px); }
        .cancel-btn { background-color: #f1f3f5; color: #495057; text-decoration: none !important; padding: 12px 30px; border-radius: 30px; font-weight: bold; text-align: center; }
        .cancel-btn:hover { background-color: #e9ecef; }

        /* 써머노트 에디터 스타일 살짝 보정 */
        .note-editor { border-radius: 10px !important; border: 1px solid #ddd !important; }

        @media (max-width: 768px) {
    body {
        padding: 20px 0; /* 위아래 여백을 줄여서 공간 확보! */
    }

    .container-custom {
        margin: 0 15px; /* 양옆 여백을 살짝 줘서 화면에 딱 붙지 않게 해요 */
        padding: 25px 20px; /* 내부 공간도 실속 있게 조절! */
    }

    h2 {
        font-size: 20px; /* 제목 크기를 적당히 줄여요 */
        margin-bottom: 25px;
    }

    /* 버튼 영역: 취소와 등록 버튼을 세로로 쌓기 */
    .btn-area {
        flex-direction: column-reverse; /* 등록하기 버튼이 위로 오게! */
        gap: 10px;
    }

    .submit-btn, .cancel-btn {
        width: 100%; /* 버튼이 화면에 꽉 차서 누르기 편해요 */
        padding: 15px;
        margin: 0;
        border-radius: 12px; /* 둥근 느낌 유지 */
    }

    /* 썸머노트 에디터가 폰 화면을 뚫고 나가지 않게 조절 */
    .note-editor {
        width: 100% !important;
    }

    .note-toolbar {
        padding: 5px !important;
        display: flex;
        flex-wrap: wrap; /* 툴바 아이콘들이 여러 줄로 예쁘게 내려오도록 */
    }
}
    </style>
</head>
<body>
    <div class="container-custom">
        <h2>새 글 작성하기</h2>
        <form action="{{ url_for('write') }}" method="POST">
            <div class="form-group">
                <label>카테고리 선택</label>
                <select name="category" class="form-control" onchange="updateClass(this)" required>
                    <option value="" disabled selected>카테고리를 선택해주세요</option>
                    <option value="게임" data-class="cat-update">🎮 게임</option>
                    <option value="애니·만화·서브컬처" data-class="cat-idea">🌸 애니·만화·서브컬처</option>
                    <option value="병맛더빙·패러디" data-class="cat-bug">🤣 병맛더빙·패러디</option>
                    <option value="동물" data-class="cat-qna">🐱 동물</option>
                    <option value="음악·노래" data-class="cat-update">🎵 음악·노래</option>
                    <option value="인터넷밈·코메디" data-class="cat-idea">🃏 인터넷밈·코메디</option>
                    <option value="해외반응·문화차이" data-class="cat-qna">🌎 해외반응·문화차이</option>
                    <option value="기술·IT·코딩" data-class="cat-update">💻 기술·IT·코딩</option>
                    <option value="기타·혼합" data-class="cat-qna">📂 기타·혼합</option>
                </select>
                <input type="hidden" name="category_class" id="category_class" value="cat-qna">
            </div>

            <div class="form-group">
                <label>작성자</label>
                <input type="text" name="author" class="form-control" placeholder="작성자 이름을 입력하세요" required>
            </div>

            <div class="form-group">
                <label>제목</label>
                <input type="text" name="title" class="form-control" placeholder="제목을 입력하세요" required>
            </div>

            <div class="form-group">
                <label>내용</label>
                <textarea id="summernote" name="content"></textarea>
            </div>

            <div class="btn-area">
                <a href="{{ url_for('index') }}" class="cancel-btn">취소</a>
                <button type="submit" class="submit-btn">등록하기</button>
            </div>
        </form>
    </div>

    <script>
        $(document).ready(function() {
            $('#summernote').summernote({
                placeholder: '내용을 상세히 입력해주세요. 이미지와 유튜브 링크도 넣을 수 있습니다.',
                tabsize: 2,
                height: 400,
                lang: 'ko-KR',
                toolbar: [
                    ['style', ['style']],
                    ['font', ['bold', 'underline', 'clear']],
                    ['color', ['color']],
                    ['para', ['ul', 'ol', 'paragraph']],
                    ['table', ['table']],
                    ['insert', ['link', 'picture', 'video']],
                    ['view', ['fullscreen', 'codeview', 'help']]
                ]
            });
        });

        // 선택한 카테고리에 맞는 디자인 클래스를 hidden input에 담아줍니다.
        function updateClass(select) {
            const selectedOption = select.options[select.selectedIndex];
            const className = selectedOption.getAttribute('data-class');
            document.getElementById('category_class').value = className;
        }
    </script>
</body>
</html>
