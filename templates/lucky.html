<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mystic Tarot Fortune</title>
<style>
:root {
    --bg-dark: #0f0c29;
    --card-bg: #1e1e3f;
    --accent: #ffd700;
    --gold: #f1c40f;
    --white: #ffffff;
    --purple: #302b63;
    --deep-purple: #24243e;
}

body {
    font-family: 'Pretendard', sans-serif;
    /* 배경을 조금 더 신비롭고 밝은 느낌의 그라데이션으로 변경 */
    background: linear-gradient(to bottom, var(--deep-purple), var(--purple), var(--bg-dark));
    color: var(--white);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    overflow: hidden;
}

h1 {
    font-weight: 300;
    letter-spacing: 10px;
    color: var(--gold);
    text-shadow: 0 0 20px rgba(241, 196, 15, 0.5);
    margin-bottom: 30px;
}

.notice-text {
    font-size: 0.9rem;
    color: #a29bfe;
    margin-bottom: 20px;
}

.scene {
    position: relative;
    width: 100vw;
    height: 550px; /* 높이 확장 */
    display: flex;
    justify-content: center;
    align-items: center;
    perspective: 2000px;
}

.card {
    position: absolute;
    width: 250px;  /* 너비 확장 (기존 200px) */
    height: 420px; /* 높이 확장 (기존 350px) */
    cursor: pointer;
    transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
    transform-style: preserve-3d;
}

.card-face {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    border-radius: 15px;
    border: 2px solid var(--gold);
    box-shadow: 0 15px 35px rgba(0,0,0,0.6);
}

.card-front {
    background: linear-gradient(135deg, #2d3436 0%, #000000 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 50px;
}

.card-front::after {
    content: '★';
    color: var(--gold);
    opacity: 0.6;
}

.card-back {
    background: var(--card-bg);
    transform: rotateY(180deg);
    display: flex;
    flex-direction: column;
    padding: 20px;
    box-sizing: border-box;
}

.card.flipped {
    transform: rotateY(180deg) scale(1.1) translateZ(100px);
    z-index: 1000 !important;
}

.tarot-img {
    width: 100%;
    height: 180px;
    object-fit: cover;
    border-radius: 8px;
    margin-bottom: 15px;
    border: 1px solid var(--gold);
}

.fortune-title {
    color: var(--gold);
    font-size: 1.2rem;
    font-weight: bold;
    margin: 0 0 12px 0;
    text-align: center;
}

.fortune-desc {
    font-size: 0.95rem;
    line-height: 1.6;
    text-align: center;
    color: #efefef;
    word-break: keep-all;
    flex-grow: 1;
    overflow-y: auto; /* 텍스트가 길어지면 내부 스크롤 발생 */
    padding-right: 5px;
}

/* 스크롤바 디자인 */
.fortune-desc::-webkit-scrollbar { width: 4px; }
.fortune-desc::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 10px; }

.lucky-box {
    margin-top: 15px;
    padding-top: 15px;
    border-top: 1px dashed rgba(255,255,255,0.2);
    font-size: 0.9rem; /* 글자 크기를 살짝 키움 */
    display: flex;
    flex-direction: column; /* 위아래로 배치 */
    gap: 8px; /* 두 줄 사이의 간격 */
    align-items: center;
}

.val { color: var(--gold); font-weight: bold; }

.controls {
    margin-top: 30px;
    z-index: 2000;
    display: flex;
    flex-direction: column;
    gap: 15px;
    align-items: center;
}

button {
    background: rgba(212, 175, 55, 0.1);
    border: 1px solid var(--gold);
    color: var(--gold);
    padding: 12px 40px;
    font-size: 1rem;
    letter-spacing: 2px;
    cursor: pointer;
    transition: 0.3s;
    border-radius: 30px;
}

button:hover:not(:disabled) {
    background: var(--gold);
    color: var(--bg-dark);
    box-shadow: 0 0 15px var(--gold);
}

button:disabled {
    opacity: 0.3;
    cursor: not-allowed;
    border-color: #666;
    color: #666;
}

.btn-home {
    background: transparent;
    border: 1px solid #fff;
    color: #fff;
    font-size: 0.8rem;
    padding: 8px 20px;
    text-decoration: none;
    border-radius: 4px;
    margin-top: 20px;
}
</style>
</head>
<body>

<h1>MYSTIC TAROT</h1>
<div class="notice-text">운명은 하루에 한 번만 속삭입니다. (딱 한번만 뽑을 수 있음)</div>

<div class="scene" id="cardScene"></div>

<div class="controls">
    <button id="shuffleBtn" onclick="startShuffle()">카드 섞기</button>
    <a href="/" class="btn-home">🏠 상태알라미 메인으로 돌아가기</a>

const scene = document.getElementById('cardScene');
const shuffleBtn = document.getElementById('shuffleBtn');
let cards = [];
let isShuffling = false;

// [1] 날짜 및 결과 체크 기능
function canPlayToday() {
    const savedData = localStorage.getItem('tarotResult');
    if (!savedData) return true;

    const data = JSON.parse(savedData);
    const today = new Date().toDateString();
    return data.date !== today;
    // 테스트용: 위 줄을 지우고 return true; 로 변경 data.date !== today;
}

// [2] 페이지 접속 시 실행되는 초기화 함수
function initCards() {
    const savedData = localStorage.getItem('tarotResult');
    const today = new Date().toDateString();

    if (savedData) {
        const data = JSON.parse(savedData);
        if (data.date === today) {
            showSavedResult(data); // 오늘 이미 뽑았다면 결과 바로 보여주기
            return;
        }
    }
    renderNewGame(); // 뽑은 적이 없거나 날짜가 지났다면 새 게임 준비
}

// [3] 새로운 카드를 화면에 배치하는 함수
function renderNewGame() {
    scene.innerHTML = '';
    cards = [];
    for (let i = 0; i < 22; i++) {
        const card = document.createElement('div');
        card.className = 'card';
        const angle = (i - 10.5) * 5;
        card.style.transform = `rotateZ(${angle}deg) translateY(-20px)`;
        card.style.zIndex = i;

        card.innerHTML = `
            <div class="card-face card-front"></div>
            <div class="card-face card-back">
                <img class="tarot-img" src="" alt="tarot">
                <div class="fortune-title"></div>
                <div class="fortune-desc"></div>
                <div class="lucky-box">
                    <div class="lucky-row">행운 번호: <span class="val l-num"></span></div>
                    <div class="lucky-row">오늘의 게임운: <span class="val l-game"></span></div>
                </div>
            </div>
        `;

        card.onclick = () => selectCard(card, i);
        scene.appendChild(card);
        cards.push(card);
    }
}

// [4] 오늘 뽑은 결과를 다시 보여주는 함수

    shuffleBtn.disabled = true;
    shuffleBtn.innerText = "오늘의 운명을 이미 확인하셨습니다.";

    scene.innerHTML = `
        <div class="card flipped" style="left:50%; top:50%; transform: translate(-50%, -50%) rotateY(180deg) scale(1.2);">
            <div class="card-face card-back">
                <img class="tarot-img" src="taro_image/${data.cardIdx}.jpg" alt="tarot">
                <div class="fortune-title">${cardNames[data.cardIdx]}</div>
                <div class="fortune-desc">${data.desc}</div>
                <div class="lucky-box">
                    <div class="lucky-row">행운 번호: <span class="val">${data.num}</span></div>
                    <div class="lucky-row">오늘의 게임운: <span class="val">${data.luck}</span></div>
                </div>
            </div>
        </div>
    `;

    const notice = document.querySelector('.notice-text');
    if(notice) notice.innerHTML = "당신이 오늘 선택했던 운명입니다. <br><small>(새로운 카드는 내일 다시 뽑을 수 있습니다)</small>";
}

// [5] 카드 섞기 애니메이션
async function startShuffle() {
    if(isShuffling || !canPlayToday()) return;
    isShuffling = true;
    shuffleBtn.disabled = true;

    // 1. 섞기 시작할 때 문구 변경
    shuffleBtn.innerText = "운명을 섞는 중입니다...";

    cards.forEach(card => {
        card.style.transform = `rotateZ(0deg) translateY(0)`;
    });

    await new Promise(r => setTimeout(r, 500));

    for(let i=0; i<2; i++) {
        cards.forEach(card => {
            const x = (Math.random() - 0.5) * 500;
            const y = (Math.random() - 0.5) * 150;
            const rot = (Math.random() - 0.5) * 180;
            card.style.transform = `translate(${x}px, ${y}px) rotate(${rot}deg)`;
        });
        await new Promise(r => setTimeout(r, 600));
    }

    cards.forEach((card, i) => {
        card.style.transform = `translateX(${(i-10.5) * 18}px)`;
        card.style.zIndex = i;
    });

    // 2. 섞기가 끝났을 때 문구 변경
    shuffleBtn.innerText = "신중하게 카드를 한 장 선택하세요";
    // 버튼을 다시 활성화하고 싶지 않다면 위 줄만 유지,
    // 클릭은 카드 자체에서 처리하므로 버튼은 안내판 역할만 하게 됩니다.
}

// [6] 카드 선택 및 데이터 저장
function selectCard(card, index) {
    if(!isShuffling || card.classList.contains('flipped')) return;

    const randomCardIdx = Math.floor(Math.random() * 22);
    const specificFortunes = cardFortunes[randomCardIdx];
    const fortuneText = specificFortunes[Math.floor(Math.random() * specificFortunes.length)];
    const luckyNum = Math.floor(Math.random() * 100) + 1;
    const gameLuck = gameLucks[Math.floor(Math.random() * gameLucks.length)];

    // 데이터 저장
    const resultData = {
        date: new Date().toDateString(),
        cardIdx: randomCardIdx,
        desc: fortuneText,
        num: luckyNum,
        luck: gameLuck
    };
    localStorage.setItem('tarotResult', JSON.stringify(resultData));

    // 카드 뒷면 채우기
    card.querySelector('.tarot-img').src = `taro_image/${randomCardIdx}.jpg`;
    card.querySelector('.fortune-title').innerText = cardNames[randomCardIdx];
    card.querySelector('.fortune-desc').innerText = fortuneText;
    card.querySelector('.l-num').innerText = luckyNum;
    card.querySelector('.l-game').innerText = gameLuck;

    // 다른 카드 숨기기
    cards.forEach(c => {
        if(c !== card) {
            c.style.opacity = "0";
            c.style.pointerEvents = "none";
        }
    });

    card.classList.add('flipped');
    card.style.left = '50%';
    card.style.top = '50%';
    card.style.transform = `translate(-50%, -50%) rotateY(180deg) scale(1.2)`;

    shuffleBtn.innerText = "오늘의 운명을 확인했습니다";
}

// [7] 실행 및 보안 설정
initCards();

// 1. 마우스 오른쪽 클릭 전면 금지 (우클릭 차단)
document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
    alert("어딜 우클릭을 하려고 하나!? 소스코드는 볼 수 없다네.");
}, false);

// 2. 텍스트 드래그 및 복사 금지 (소스 분석 방지)
document.addEventListener('selectstart', function(e) {
    e.preventDefault();
});

// 3. 키보드 단축키 정밀 차단
document.addEventListener('keydown', function(e) {
    // F12 (개발자 도구)
    if (e.key === "F12") {
        e.preventDefault();
        alert("어딜 개발자 모드를 틀려고 하나!?");
    }

    // Ctrl + Shift + I (개발자 도구)
    if (e.ctrlKey && e.shiftKey && e.key === "I") {
        e.preventDefault();
        alert("개발자 도구는 금지되어 있네!");
    }

    // Ctrl + Shift + J (콘솔창)
    if (e.ctrlKey && e.shiftKey && e.key === "J") {
        e.preventDefault();
        alert("콘솔창을 열 수 없습니다.");
    }

    // Ctrl + Shift + C (요소 검사)
    if (e.ctrlKey && e.shiftKey && e.key === "C") {
        e.preventDefault();
        alert("요소 검사 기능을 사용할 수 없습니다.");
    }

    // Ctrl + U (소스 보기)
    if (e.ctrlKey && e.key === "u") {
        e.preventDefault();
        alert("소스 코드를 훔쳐보는 건 예의가 아니지!");
    }

    // Ctrl + S (페이지 저장 금지)
    if (e.ctrlKey && e.key === "s") {
        e.preventDefault();
        alert("페이지 저장은 허용되지 않습니다.");
    }
}, false);

</script>
