<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Roulette Game - Enhanced Version</title>
    <style>
        :root { --bg: #0a0a0a; --panel: #161616; --accent: #e74c3c; --text: #dcdcdc; }
        body { background: var(--bg); color: var(--text); font-family: 'Malgun Gothic', sans-serif; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 20px; overflow-x: hidden; }

        /* 🏠 상단 버튼 레이아웃 */
        .top-nav { display: flex; gap: 10px; margin-bottom: 20px; }
        .btn-nav { padding: 10px 20px; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; border: 1px solid #444; cursor: pointer; transition: 0.3s; background-color: #2c3e50; }
        .btn-nav:hover { border-color: #f1c40f; color: #f1c40f; }

        #game-container { width: 950px; background: var(--panel); border: 2px solid #333; padding: 20px; border-radius: 10px; box-shadow: 0 0 40px rgba(0,0,0,0.8); position: relative; }

        /* 🎮 시작 오버레이 */
        #start-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; border-radius: 10px; }
        #btn-start-game { padding: 20px 50px; font-size: 30px; background: #e74c3c; color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; box-shadow: 0 0 20px rgba(231, 76, 60, 0.5); }
        #btn-start-game:hover { transform: scale(1.05); background: #ff5e4d; }

        /* 📜 모달 스타일 */
        .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); }
        .modal-content { background: #1a1a1a; margin: 5% auto; padding: 20px; border: 2px solid #f1c40f; width: 600px; border-radius: 10px; max-height: 80vh; overflow-y: auto; }
        .modal-header { font-size: 24px; color: #f1c40f; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 15px; display: flex; justify-content: space-between; }
        .close-modal { cursor: pointer; color: #888; }
        .item-info-grid { display: grid; grid-template-columns: 100px 1fr; gap: 10px; font-size: 14px; }
        .item-name-tag { color: #3498db; font-weight: bold; border-right: 1px solid #333; }

        /* 기존 게임 스타일 유지 */
        .header { text-align: center; border-bottom: 2px solid #333; margin-bottom: 20px; padding-bottom: 10px; }
        .status-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        .entity-box { padding: 15px; border: 1px solid #444; border-radius: 8px; position: relative; transition: 0.3s; }
        .entity-box.active { border-color: #f1c40f; background: #1e1e1e; }
        .hp-bar { font-size: 28px; font-weight: bold; color: var(--accent); letter-spacing: 2px; }
        .item-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 15px; min-height: 100px; }
        .item-slot { background: #2c3e50; border: 1px solid #455a64; color: white; padding: 8px 4px; font-size: 13px; cursor: pointer; border-radius: 4px; text-align: center; }
        .item-slot:hover { background: #34495e; border-color: #f1c40f; }
        .dealer-item { background: #4b2c2c; cursor: default; }
        #log-window { height: 280px; background: #000; border: 1px solid #333; margin: 20px 0; padding: 15px; overflow-y: auto; font-family: 'Consolas', monospace; font-size: 14px; line-height: 1.6; color: #aaa; }
        .log-important { color: #f1c40f; font-weight: bold; }
        .log-danger { color: #ff4d4d; }
        .action-area { display: flex; gap: 15px; }
        .btn-action { flex: 1; height: 60px; font-size: 20px; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; transition: 0.2s; color: white; }
        #btn-to-dealer { background: #c0392b; }
        #btn-to-self { background: #2980b9; }
        .btn-action:disabled { background: #333 !important; color: #666; }
        .ammo-info { color: #3498db; text-align: center; font-weight: bold; margin: 10px 0; font-size: 18px; }
        @keyframes fadeOut {
    0% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    70% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
}

@keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-10px); }
    50% { transform: translateX(10px); }
    75% { transform: translateX(-10px); }
}
    </style>
</head>
<body>

<div class="top-nav">
    <a href="/" class="btn-nav">🏠 메인으로</a>
    <button class="btn-nav" onclick="toggleModal(true)">📖 아이템 도감</button>
</div>

<div id="game-container">
    <div id="start-overlay">
        <h2 style="color: #f1c40f; margin-bottom: 30px;">준비가 되었습니까?</h2>
        <button id="btn-start-game" onclick="startGame()">GAME START</button>
    </div>

    <div class="header">
        <h1 id="wave-title" style="margin:0;">WAVE 1</h1>
        <div id="ammo-display" class="ammo-info">대기 중...</div>
    </div>

    <div class="status-grid">
        <div id="player-panel" class="entity-box">
            <div style="font-size: 14px; color: #888;">PLAYER</div>
            <div id="p-hp" class="hp-bar">♥♥♥</div>
            <div id="p-items" class="item-container"></div>
            <div id="p-mod" style="font-size: 12px; margin-top: 5px; color: #3498db;"></div>
        </div>
        <div id="dealer-panel" class="entity-box">
            <div style="font-size: 14px; color: #888;">DEALER</div>
            <div id="d-hp" class="hp-bar">♥♥♥</div>
            <div id="d-items" class="item-container"></div>
            <div id="d-mod" style="font-size: 12px; margin-top: 5px; color: #e74c3c;"></div>
        </div>
    </div>

    <div id="log-window"></div>

    <div class="action-area">
        <button id="btn-to-dealer" class="btn-action" onclick="handleFire(false)" disabled>DEALER 사격</button>
        <button id="btn-to-self" class="btn-action" onclick="handleFire(true)" disabled>본인 사격</button>
    </div>
</div>

<div id="item-modal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <span>아이템 효과 도감</span>
            <span class="close-modal" onclick="toggleModal(false)">&times;</span>
        </div>
        <div class="item-info-grid" id="modal-item-list">
            </div>
    </div>
</div>

<script>
const ITEM_INFO = {
    "확대경": "다음 탄환이 실탄(🔴)인지 공포탄(⚪)인지 즉시 확인합니다.",
    "수갑": "상대방의 다음 턴을 강제로 건너뛰게 만듭니다.",
    "담배갑": "체력을 1 회복합니다. (최대 체력까지)",
    "손톱": "탄창의 맨 앞 탄환을 제거합니다.",
    "맥주": "탄창의 맨 뒤 탄환을 제거합니다.",
    "쇠톱": "다음 사격 시 실탄 대미지가 2배가 됩니다.",
    "휴대폰": "탄창 속 무작위 탄환 하나의 위치와 종류를 확인합니다.",
    "약": "50% 확률로 체력 +1, 50% 확률로 체력 -1 (도박!)",
    "방탄복": "다음 1번의 공격 피해를 완전히 무시합니다.",
    "주사기": "상대방의 아이템 중 하나를 무작위로 훔쳐옵니다.",
    "나이프": "상대에게 즉시 1의 피해를 입힙니다.",
    "동전": "60% 확률로 다음 피해 3배, 40% 확률로 본인 HP -1",
    "눈알": "자신의 HP를 2 소모하고 무작위 아이템 2개를 받습니다.",
    "술": "HP 2를 회복하지만, 취해서 다음 턴을 쉽니다.",
    "미니에어컨": "현재 발사될 탄환의 성질을 반전시킵니다.",
    "도화선": "현재 탄창의 탄환 순서를 무작위로 섞습니다.",
    "전기충격기": "상대방의 아이템 중 하나를 무작위로 파괴합니다."
};
const ITEM_LIST = Object.keys(ITEM_INFO);

const WAVE_CONFIG = {
    1: { hp: 3, d_hp: 3, ammo: 6, items: 2 },
    2: { hp: 4, d_hp: 5, ammo: 8, items: 3 },
    3: { hp: 5, d_hp: 6, ammo: 10, items: 4 },
    4: { hp: 6, d_hp: 7, ammo: 12, items: 5 }
};

let state = {
    wave: 1, p_hp: 3, d_hp: 3, p_max: 3, d_max: 3,
    mag: [], p_items: [], d_items: [],
    turn: "P", dmg: 1,
    p_skip: false, d_skip: false,
    p_armor: false, d_armor: false,
    p_charm: false, d_charm: false,
    known_shot: null
};

// --- [초기화 및 공통 함수] ---

function toggleModal(show) {
    document.getElementById('item-modal').style.display = show ? 'block' : 'none';
}

function fillItemModal() {
    const container = document.getElementById('modal-item-list');
    container.innerHTML = "";
    for (const [name, desc] of Object.entries(ITEM_INFO)) {
        container.innerHTML += `<div class="item-name-tag">${name}</div><div>${desc}</div>`;
    }
}

function startGame() {
    document.getElementById('start-overlay').style.display = 'none';
    initWave(1);
    log("게임을 시작합니다. 행운을 빕니다.");
}

function log(msg, type = "") {
    const win = document.getElementById('log-window');
    const div = document.createElement('div');
    div.className = `log-entry ${type}`;
    div.innerHTML = `> ${msg}`;
    win.appendChild(div);
    win.scrollTop = win.scrollHeight;
}

// --- [핵심 전투 로직: 사격 연출 및 결과] ---

function handleFire(isSelf) {
    if(state.mag.length === 0) return;

    // 사격 중 버튼 잠금 (버그 방지)
    document.getElementById('btn-to-dealer').disabled = true;
    document.getElementById('btn-to-self').disabled = true;

    const isLive = state.mag.shift();
    const shooter = state.turn === "P" ? "PLAYER" : "DEALER";
    const targetName = isSelf ? shooter : (state.turn === "P" ? "DEALER" : "PLAYER");

    log(`${shooter}가 ${isSelf ? "자신" : "상대"}를 겨냥합니다...`);

    setTimeout(() => {
        if(isLive) {
            const msg = `💥 ${shooter} ➔ ${targetName} [실탄]!`;
            showGameAlert(msg, "#ff4d4d");
            log(msg, "log-danger");
            shakeScreen();

            // 대미지 적용 대상 계산
            const targetKey = isSelf ? state.turn : (state.turn === "P" ? "D" : "P");
            applyDamage(targetKey, state.dmg);

            state.dmg = 1;
            state.turn = (state.turn === "P") ? "D" : "P";
        } else {
            const msg = `💨 ${shooter} ➔ ${targetName} [공포탄]`;
            showGameAlert(msg, "#3498db");
            log(msg);

            state.dmg = 1;
            // 본인 사격 시 공포탄이면 턴 유지
            if(!isSelf) state.turn = (state.turn === "P") ? "D" : "P";
            else log(`🔄 ${shooter}가 자신에게 쏘아 턴이 유지됩니다.`, "log-important");
        }

        processTurnEnd();
    }, 800);
}

function applyDamage(target, amount) {
    if(target === "P") {
        if(state.p_armor) {
            log("🛡️ PLAYER가 방탄복으로 방어했습니다!");
            state.p_armor = false;
        } else {
            state.p_hp -= amount;
            log(`💔 PLAYER가 ${amount}의 피해를 입었습니다.`);
        }
    } else {
        if(state.d_armor) {
            log("🛡️ DEALER가 방탄복으로 방어했습니다!");
            state.d_armor = false;
        } else {
            state.d_hp -= amount;
            log(`💢 DEALER가 ${amount}의 피해를 입었습니다.`);
        }
    }
}

function processTurnEnd() {
    // 수갑(턴 건너뛰기) 체크
    if(state.turn === "P" && state.p_skip) {
        log("⛓️ PLAYER 수갑 구속! 턴이 넘어갑니다.");
        state.p_skip = false;
        state.turn = "D";
    } else if(state.turn === "D" && state.d_skip) {
        log("⛓️ DEALER 수갑 구속! 턴이 넘어갑니다.");
        state.d_skip = false;
        state.turn = "P";
    }

    state.known_shot = null;
    updateUI();

    // 게임 종료 여부 확인 후 딜러 턴이면 실행
    if(!checkGameOver() && state.turn === "D") {
        setTimeout(dealerLogic, 1500);
    }
}

// --- [시각 효과 함수] ---

function showGameAlert(msg, color) {
    const alertDiv = document.createElement('div');
    alertDiv.style.cssText = `
        position: fixed; top: 40%; left: 50%; transform: translate(-50%, -50%);
        background: rgba(0,0,0,0.9); color: ${color}; padding: 30px 60px;
        border: 4px solid ${color}; border-radius: 15px; font-size: 35px;
        font-weight: bold; z-index: 2000; pointer-events: none;
        box-shadow: 0 0 50px rgba(0,0,0,1); animation: fadeOut 1.5s forwards;
        text-shadow: 2px 2px 5px black;
    `;
    alertDiv.innerText = msg;
    document.body.appendChild(alertDiv);
    setTimeout(() => alertDiv.remove(), 1500);
}

function shakeScreen() {
    const container = document.getElementById('game-container');
    container.style.animation = 'shake 0.5s';
    setTimeout(() => container.style.animation = '', 500);
}

// --- [시스템 로직] ---

function checkGameOver() {
    if(state.p_hp <= 0) {
        alert("💀 당신은 사망했습니다. GAME OVER.");
        location.reload();
        return true;
    }
    if(state.d_hp <= 0) {
        if(state.wave < 4) {
            alert(`🎉 WAVE ${state.wave} 승리! 다음 단계로 진입합니다.`);
            initWave(state.wave + 1);
        } else {
            alert("🏆 최종 승리! 당신은 전설적인 도박사가 되었습니다!");
            location.reload();
        }
        return true;
    }

    // 탄창 소진 시 로직: 결판이 나지 않았다면 자동 재장전
    if(state.mag.length === 0) {
        log("🔄 탄창 소진. 새로 장전하고 게임을 계속합니다.", "log-important");
        setTimeout(() => {
            setupMag();
        }, 1000);
        return false;
    }
    return false;
}

function setupMag() {
    const conf = WAVE_CONFIG[state.wave];
    const total = conf.ammo;
    const live = Math.max(1, Math.floor(total/2) + (Math.random() > 0.5 ? 1 : 0));
    const blank = total - live;

    let m = [];
    for(let i=0; i<live; i++) m.push(true);
    for(let i=0; i<blank; i++) m.push(false);
    state.mag = m.sort(() => Math.random() - 0.5);

    // [중요] 장전 시 무조건 플레이어 선제로 초기화
    state.turn = "P";
    state.p_skip = false;
    state.d_skip = false;
    state.known_shot = null;

    alert(`🔫 탄창 장전!\n실탄: ${live} / 공포탄: ${blank}\n당신의 턴부터 시작합니다.`);

    // 장전 시 아이템 지급
    for(let i=0; i<conf.items; i++) {
        if(state.p_items.length < 8) state.p_items.push(ITEM_LIST[Math.floor(Math.random()*ITEM_LIST.length)]);
        if(state.d_items.length < 8) state.d_items.push(ITEM_LIST[Math.floor(Math.random()*ITEM_LIST.length)]);
    }

    updateUI();
    log("턴이 초기화되었습니다. 플레이어의 차례입니다.");
}

// --- (UI 업데이트 및 딜러 로직 등 나머지 부분은 이전과 동일하게 유지) ---
function updateUI() {
    document.getElementById('p-hp').innerText = "♥".repeat(Math.max(0, state.p_hp));
    document.getElementById('d-hp').innerText = "♥".repeat(Math.max(0, state.d_hp));
    document.getElementById('wave-title').innerText = `WAVE ${state.wave}`;
    document.getElementById('ammo-display').innerText = `남은 탄환: ${state.mag.length}발`;
    renderItems('p-items', state.p_items, true);
    renderItems('d-items', state.d_items, false);
    const isPTurn = (state.turn === "P");
    document.getElementById('btn-to-dealer').disabled = !isPTurn;
    document.getElementById('btn-to-self').disabled = !isPTurn;
}

function renderItems(id, list, clickable) {
    const container = document.getElementById(id);
    container.innerHTML = "";
    list.forEach((name, idx) => {
        const btn = document.createElement('button');
        btn.className = `item-slot ${!clickable ? 'dealer-item' : ''}`;
        btn.innerText = name;
        if(clickable) btn.onclick = () => useItem(idx);
        container.appendChild(btn);
    });
}

async function dealerLogic() {
    if(state.turn !== "D") return;

    // 1. 아이템 사용 단계 (최대 3개까지 사용하도록 상향)
    let itemsUsed = 0;
    while(itemsUsed < 3 && state.d_items.length > 0) {
        let chosenIdx = -1;
        const d_items = state.d_items;

        // --- 아이템 사용 우선순위 로직 ---

        // 1순위: 체력이 낮을 때 회복 (담배갑, 술, 약)
        if (state.d_hp <= state.d_max - 1 && d_items.includes("담배갑")) {
            chosenIdx = d_items.indexOf("담배갑");
        } else if (state.d_hp <= state.d_max - 2 && d_items.includes("술")) {
            chosenIdx = d_items.indexOf("술");
        }
        // 2순위: 정보 확인 (확대경, 휴대폰)
        else if (state.known_shot === null && d_items.includes("확대경")) {
            chosenIdx = d_items.indexOf("확대경");
        } else if (state.known_shot === null && d_items.includes("휴대폰")) {
            chosenIdx = d_items.indexOf("휴대폰");
        }
        // 3순위: 공격 강화 (쇠톱, 동전, 나이프) - 실탄임을 알 때만 사용
        else if (state.known_shot === true && d_items.includes("쇠톱")) {
            chosenIdx = d_items.indexOf("쇠톱");
        } else if (state.known_shot === true && d_items.includes("동전")) {
            chosenIdx = d_items.indexOf("동전");
        } else if (d_items.includes("나이프")) {
            chosenIdx = d_items.indexOf("나이프");
        }
        // 4순위: 방어 및 유틸 (방탄복, 주사기, 수갑)
        else if (!state.d_armor && d_items.includes("방탄복")) {
            chosenIdx = d_items.indexOf("방탄복");
        } else if (d_items.includes("주사기")) {
            chosenIdx = d_items.indexOf("주사기");
        } else if (!state.p_skip && d_items.includes("수갑")) {
            chosenIdx = d_items.indexOf("수갑");
        }
        // 5순위: 탄창 조작 (공포탄임을 알 때 반전시키거나 버리기)
        else if (state.known_shot === false && d_items.includes("미니에어컨")) {
            chosenIdx = d_items.indexOf("미니에어컨");
        } else if (state.known_shot === false && d_items.includes("손톱")) {
            chosenIdx = d_items.indexOf("손톱");
        }

        // 아이템을 결정했다면 사용
        if(chosenIdx !== -1) {
            useItem(chosenIdx, true);
            itemsUsed++;
            await new Promise(r => setTimeout(r, 800)); // 아이템 간 사용 간격
        } else {
            // 더 이상 쓸만한 아이템이 없으면 확률적으로 무작위 아이템 하나 사용 (실수 유도)
            if (Math.random() < 0.2) {
                chosenIdx = Math.floor(Math.random() * d_items.length);
                useItem(chosenIdx, true);
                itemsUsed++;
                await new Promise(r => setTimeout(r, 800));
            }
            break;
        }
    }

    // 2. 사격 결정 단계
    let selfShoot = false;

    if(state.known_shot === false) {
        // 공포탄인걸 알면 자신에게 쏴서 턴 유지
        selfShoot = true;
    } else if(state.known_shot === true) {
        // 실탄인걸 알면 무조건 플레이어에게
        selfShoot = false;
    } else {
        // 모를 때는 남은 실탄 비율 계산
        const liveCount = state.mag.filter(x => x).length;
        const totalCount = state.mag.length;
        const liveRatio = liveCount / totalCount;

        // 실탄 확률이 낮으면(30% 미만) 자신에게 사격 도박
        if(liveRatio < 0.3) selfShoot = true;
        else selfShoot = false;
    }

    setTimeout(() => handleFire(selfShoot), 500);
}

function initWave(w) {
    const conf = WAVE_CONFIG[w];
    state.wave = w;

    state.p_hp = conf.hp;
    state.p_max = conf.hp;
    state.d_hp = conf.d_hp;
    state.d_max = conf.d_hp;

    state.p_items = [];
    state.d_items = [];

    state.p_armor = false;
    state.d_armor = false;
    state.p_skip = false;
    state.d_skip = false;
    state.dmg = 1;

    // 라운드 시작 시 플레이어 선공 설정
    state.turn = "P";
    setupMag();
}

function useItem(idx, isDealer = false) {
    const list = isDealer ? state.d_items : state.p_items;
    const name = list.splice(idx, 1)[0]; // 사용한 아이템 제거 및 이름 가져오기
    const user = isDealer ? "DEALER" : "PLAYER";

    log(`${user}가 [${name}] 아이템을 사용했습니다.`, "log-important");

    switch(name) {
        case "확대경":
            const top = state.mag[0] ? "실탄 🔴" : "공포탄 ⚪";
            if(!isDealer) alert(`🔍 현재 장전된 탄환은 [${top}] 입니다.`);
            else state.known_shot = state.mag[0];
            break;

        case "수갑":
            if(isDealer) state.p_skip = true;
            else state.d_skip = true;
            break;

        case "담배갑":
            if(isDealer) state.d_hp = Math.min(state.d_max, state.d_hp + 1);
            else state.p_hp = Math.min(state.p_max, state.p_hp + 1);
            break;

        case "손톱":
            const removed = state.mag.shift();
            log(`💅 맨 앞 탄환(${removed ? "실탄" : "공포탄"})을 제거했습니다.`);
            break;

        case "맥주":
            const popped = state.mag.pop();
            log(`🍺 맨 뒤 탄환(${popped ? "실탄" : "공포탄"})을 제거했습니다.`);
            break;

        case "쇠톱":
            state.dmg = 2;
            log(`🪚 다음 사격 대미지가 2배가 됩니다!`);
            break;

        case "휴대폰":
            const rndIdx = Math.floor(Math.random() * state.mag.length);
            const type = state.mag[rndIdx] ? "실탄" : "공포탄";
            if(!isDealer) alert(`📱 휴대폰 확인: ${rndIdx + 1}번째 탄환은 [${type}]입니다.`);
            break;

        case "약":
            if(Math.random() < 0.5) {
                log("💊 약효가 좋습니다! HP +1");
                if(isDealer) state.d_hp = Math.min(state.d_max, state.d_hp + 1);
                else state.p_hp = Math.min(state.p_max, state.p_hp + 1);
            } else {
                log("💊 부작용 발생! HP -1", "log-danger");
                if(isDealer) state.d_hp--; else state.p_hp--;
            }
            break;

        case "방탄복":
            if(isDealer) state.d_armor = true;
            else state.p_armor = true;
            break;

        case "주사기":
            const targetList = isDealer ? state.p_items : state.d_items;
            if(targetList.length > 0) {
                const stolen = targetList.splice(Math.floor(Math.random()*targetList.length), 1)[0];
                if(isDealer) state.d_items.push(stolen); else state.p_items.push(stolen);
                log(`💉 상대의 [${stolen}]을 훔쳐왔습니다!`);
            }
            break;

        case "나이프":
            if(isDealer) applyDamage("P", 1);
            else applyDamage("D", 1);
            break;

        case "동전":
            if(Math.random() < 0.6) {
                state.dmg = 3;
                log("🪙 앞면! 다음 사격 대미지 3배!");
            } else {
                if(isDealer) state.d_hp--; else state.p_hp--;
                log("🪙 뒷면... 본인 HP -1", "log-danger");
            }
            break;

        case "눈알":
            // 눈알은 사용 시 HP가 깎이는 것이므로 최대 체력 체크가 필요 없지만,
            // 혹시라도 체력이 0이 되어 즉사하는 것을 방지하기 위해 사망 체크가 중요합니다.
            if(isDealer) state.d_hp -= 2; else state.p_hp -= 2;
            log("👁️ 자신의 HP를 2 바쳐 아이템 2개를 얻습니다.");
            for(let i=0; i<2; i++) {
                let newItem = ITEM_LIST[Math.floor(Math.random()*ITEM_LIST.length)];
                if(isDealer) state.d_items.push(newItem); else state.p_items.push(newItem);
            }
            break;

        case "술":
            log("🍷 술을 마셔 체력을 회복하지만 취기가 오릅니다.");
            if(isDealer) {
                state.d_hp = Math.min(state.d_max, state.d_hp + 2);
                state.d_skip = true;
            } else {
                state.p_hp = Math.min(state.p_max, state.p_hp + 2);
                state.p_skip = true;
            }
            break;

        case "미니에어컨":
            if(state.mag.length > 0) {
                state.mag[0] = !state.mag[0];
                log("❄️ 다음 탄환의 성질이 반전되었습니다.");
            }
            break;

        case "도화선":
            state.mag.sort(() => Math.random() - 0.5);
            log("🧨 탄창을 무작위로 다시 섞었습니다.");
            break;

        case "전기충격기":
            const enemyItems = isDealer ? state.p_items : state.d_items;
            if(enemyItems.length > 0) {
                const broken = enemyItems.splice(Math.floor(Math.random()*enemyItems.length), 1)[0];
                log(`⚡ 상대의 [${broken}]을 파괴했습니다!`);
            }
            break;
    }

    updateUI();
    checkGameOver();
}

fillItemModal();
</script>
