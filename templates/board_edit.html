<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>글 수정 - 멤버십 페이지</title>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/summernote@0.8.18/dist/summernote.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/summernote@0.8.18/dist/summernote.min.js"></script>

    <style>
        /* 2. write 페이지의 세련된 스타일 그대로 적용 */
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f9f9f9; padding: 50px 0; }
        .container-custom { max-width: 900px; margin: 0 auto; background: white; padding: 40px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { font-size: 24px; margin-bottom: 30px; color: #5c7cfa; font-weight: bold; border-left: 5px solid #5c7cfa; padding-left: 15px; }

        .form-group label { font-weight: 600; color: #555; margin-bottom: 8px; }
        .form-control { border-radius: 8px; border: 1px solid #ddd; padding: 10px; height: auto; }

        .btn-area { display: flex; justify-content: flex-end; gap: 12px; margin-top: 30px; }
        .submit-btn { background-color: #5c7cfa; color: white; border: none; padding: 12px 30px; border-radius: 30px; font-weight: bold; transition: 0.2s; }
        .submit-btn:hover { background-color: #4263eb; transform: translateY(-2px); }
        .cancel-btn { background-color: #f1f3f5; color: #495057; text-decoration: none !important; padding: 12px 30px; border-radius: 30px; font-weight: bold; text-align: center; }
        .cancel-btn:hover { background-color: #e9ecef; }

        .note-editor { border-radius: 10px !important; border: 1px solid #ddd !important; }

        /* 📱 글 수정 페이지 모바일 반응형 */
@media (max-width: 768px) {
    body {
        padding: 20px 0; /* 위아래 여백을 줄여요 */
    }

    .container-custom {
        margin: 0 15px; /* 양옆에 살짝 여백을 줘서 화면에 딱 붙지 않게 해요 */
        padding: 25px 20px; /* 내부 여백 조절 */
    }

    h2 {
        font-size: 20px; /* 제목 크기를 살짝 줄여요 */
        margin-bottom: 20px;
    }

    /* 버튼 영역 조절 */
    .btn-area {
        flex-direction: column-reverse; /* 취소 버튼이 아래로, 수정완료가 위로! */
        gap: 10px;
    }

    .submit-btn, .cancel-btn {
        width: 100%; /* 버튼을 화면에 꽉 차게 해서 누르기 편하게 해요 */
        padding: 15px; /* 높이를 키워서 터치하기 좋게! */
        margin: 0;
    }

    /* 썸머노트 에디터 내부의 툴바가 넘치지 않도록 조절 */
    .note-toolbar {
        padding: 5px !important;
    }

    .note-btn-group {
        margin: 2px !important;
    }
}
    </style>
</head>
<body>
    <div class="container-custom">
        <h2>글 수정하기</h2>
        <form action="{{ url_for('edit_post', post_id=post.id) }}" method="POST">
            <div class="form-group">
                <label>카테고리 선택</label>
                <select name="category" class="form-control" onchange="updateClass(this)" required>
                    <option value="게임" data-class="cat-update" {% if post.category == '게임' %}selected{% endif %}>🎮 게임</option>
                    <option value="애니·만화·서브컬처" data-class="cat-idea" {% if post.category == '애니·만화·서브컬처' %}selected{% endif %}>🌸 애니·만화·서브컬처</option>
                    <option value="병맛더빙·패러디" data-class="cat-bug" {% if post.category == '병맛더빙·패러디' %}selected{% endif %}>🤣 병맛더빙·패러디</option>
                    <option value="동물" data-class="cat-qna" {% if post.category == '동물' %}selected{% endif %}>🐱 동물</option>
                    <option value="음악·노래" data-class="cat-update" {% if post.category == '음악·노래' %}selected{% endif %}>🎵 음악·노래</option>
                    <option value="인터넷밈·코메디" data-class="cat-idea" {% if post.category == '인터넷밈·코메디' %}selected{% endif %}>🃏 인터넷밈·코메디</option>
                    <option value="해외반응·문화차이" data-class="cat-qna" {% if post.category == '해외반응·문화차이' %}selected{% endif %}>🌎 해외반응·문화차이</option>
                    <option value="기술·IT·코딩" data-class="cat-update" {% if post.category == '기술·IT·코딩' %}selected{% endif %}>💻 기술·IT·코딩</option>
                    <option value="기타·혼합" data-class="cat-qna" {% if post.category == '기타·혼합' %}selected{% endif %}>📂 기타·혼합</option>
                </select>
                <input type="hidden" name="category_class" id="category_class" value="{{ post.category_class }}">
            </div>

            <div class="form-group">
                <label>작성자</label>
                <input type="text" name="author" class="form-control" value="{{ post.author }}" required>
            </div>

            <div class="form-group">
                <label>제목</label>
                <input type="text" name="title" class="form-control" value="{{ post.title }}" required>
            </div>

            <div class="form-group">
                <label>내용</label>
                <textarea id="summernote" name="content">{{ post.content }}</textarea>
            </div>

            <div class="btn-area">
                <a href="{{ url_for('post_detail', post_id=post.id) }}" class="cancel-btn">취소</a>
                <button type="submit" class="submit-btn">수정완료</button>
            </div>
        </form>
    </div>

    <script>
        $(document).ready(function() {
            $('#summernote').summernote({
                tabsize: 2,
                height: 400,
                lang: 'ko-KR',
                toolbar: [
                    ['style', ['style']],
                    ['font', ['bold', 'underline', 'clear']],
                    ['color', ['color']],
                    ['para', ['ul', 'ol', 'paragraph']],
                    ['table', ['table']],
                    ['insert', ['link', 'picture', 'video']],
                    ['view', ['fullscreen', 'codeview', 'help']]
                ]
            });
        });

        function updateClass(select) {
            const selectedOption = select.options[select.selectedIndex];
            const className = selectedOption.getAttribute('data-class');
            document.getElementById('category_class').value = className;
        }
    </script>
</body>
</html>
